name: Sync From Hugging Face Bucket to GitHub
on:
  workflow_dispatch: # 建议手动触发，安全可控

jobs:
  sync-bucket-to-github:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要向 GitHub 仓库写入的权限

    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          # 将 hf 添加到 PATH，以便后续步骤使用
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Authenticate with Hugging Face
        run: hf auth login --token ${{ secrets.HF_TOKEN }}

      - name: Sync Bucket to Local Directory
        run: |
          # 将 bucket 内容同步到当前工作目录（GitHub 仓库根目录）
          # hf://buckets/<owner>/<bucket-name>
          hf buckets sync hf://buckets/${{ secrets.HF_USERNAME }}/${{ secrets.HF_BUCKET_NAME }} . --delete
          # --delete 选项会镜像删除：本地有而 bucket 没有的文件将被删除，确保内容完全一致

      - name: Commit and Push to GitHub
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          if ! git diff --quiet; then
            echo "Changes detected. Committing and pushing to GitHub."
            git add -A
            git commit -m "Sync: Content pulled from Hugging Face Bucket"
            git push origin main
          else
            echo "No new changes from Hugging Face Bucket. Skipping commit."
          fi
