name: Sync From Hugging Face Bucket to GitHub
on:
  workflow_dispatch: # 手动触发，安全可控
  # 如需定时同步，取消下面注释（示例：每6小时一次）
  # schedule:
  #   - cron: '0 */6 * * *'

jobs:
  sync-bucket-to-github:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要向 GitHub 仓库写入的权限

    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Authenticate with Hugging Face
        run: hf auth login --token ${{ secrets.HF_TOKEN }}

      - name: Sync Bucket to Local Directory
        run: |
          # 同步 bucket 内容到当前工作目录
          # --delete: 镜像删除（本地有而 bucket 没有的文件会被删除）
          # --exclude ".git/**": 保护 .git 目录不被删除，否则会破坏 Git 仓库
          hf buckets sync hf://buckets/${{ secrets.HF_USERNAME }}/${{ secrets.HF_BUCKET_NAME }} . \
            --delete \
            --exclude ".git/**"

      - name: Commit and Push to GitHub
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          if ! git diff --quiet; then
            echo "Changes detected. Committing and pushing to GitHub."
            git add -A
            git commit -m "Sync: Content pulled from Hugging Face Bucket"
            git push origin main
          else
            echo "No new changes from Hugging Face Bucket. Skipping commit."
          fi
